<h1 class="tags__title">TAGS</h1>
<ul class="tags__list">
  {{ range $name, $taxonomy := .Site.Taxonomies.tags }}
    <a class="tags__item" href="{{ "/tags/" | relLangURL }}{{ $name | urlize }}">{{ $name }}</a>
  {{ end }}
</ul>
<a href="{{ with .Site.Home.OutputFormats.Get "rss" }}{{ .Permalink }}{{ end }}" target="_blank" class="rss-button">
  <i class="fas fa-rss"></i>
  RSS FEED
</a>
