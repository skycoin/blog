baseURL = "https://blog.theskywirenetwork.net/"
languageCode = "en-us"
title = "Skycoin Blog"
defaultContentLanguage = "en"

# Served from the root of a custom domain, so absolute URLs are correct and
# unambiguous for crawlers. canonifyURLs keeps root-relative links written in
# post markdown (/img/foo.png) resolving against baseURL.
relativeURLs = false
canonifyURLs = true
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    noClasses = false

#disqusShortname = ""

ignoreFiles = ["\\.Rmd$", "_files$", "_cache$"]

[module]
  [[module.imports]]
    path = "skycoin"

[permalinks]
	posts = "/posts/:contentbasename/"
	spanish = "/posts/:contentbasename/"
	greek = "/posts/:contentbasename/"
	chinese = "/posts/:contentbasename/"
	russian = "/posts/:contentbasename/"
	italian = "/posts/:contentbasename/"
	french = "/posts/:contentbasename/"
	korean = "/posts/:contentbasename/"
	japanese = "/posts/:contentbasename/"
	portuguese = "/posts/:contentbasename/"
	german = "/posts/:contentbasename/"

[[menu.main]]
    name = "Skywire Network"
    identifier = "skywire-network"
    url = "//theskywirenetwork.net"
    weight = -3
[[menu.main]]
    name = "Skywire Docs"
    identifier = "skywire-docs"
    url = "//skycoin.github.io/skywire/"
    weight = -1
[[menu.main]]
    name = "Explorer"
    identifier = "explorer"
    url = "//explorer.skycoin.com"
    weight = 1

[params]
  author = "Skycoin"
  defaultLang = "en"
  # Used as the <title> suffix on the home page and in JSON-LD.
  tagline = "Skywire Development Updates"
