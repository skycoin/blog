[security]
  enableInlineShortcodes = false
  [security.exec]
    allow = ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$']
    osEnv = ['(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$']

  [security.funcs]
    getenv = ['^HUGO_', 'CSS_VERSION']
  [security.http]
    methods = ['(?i)GET|POST']
    urls = ['.*']

# Per-language title suffix and meta description. Without these, every
